<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark circle backing for contrast in browser tabs -->
  <circle cx="32" cy="32" r="30" fill="#07120c"/>
  <!-- Neon green outer accent ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#00d16c" stroke-width="2.5"/>
  <!-- White soccer ball body -->
  <circle cx="32" cy="32" r="23" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Center pentagon -->
  <polygon points="32,24 38,28.5 36,35.5 28,35.5 26,28.5" fill="#0f172a"/>
  <!-- Seam lines from center pentagon to perimeter -->
  <line x1="32" y1="24" x2="32" y2="10" stroke="#1e293b" stroke-width="2"/>
  <line x1="38" y1="28.5" x2="49.5" y2="22" stroke="#1e293b" stroke-width="2"/>
  <line x1="36" y1="35.5" x2="45" y2="46" stroke="#1e293b" stroke-width="2"/>
  <line x1="28" y1="35.5" x2="19" y2="46" stroke="#1e293b" stroke-width="2"/>
  <line x1="26" y1="28.5" x2="14.5" y2="22" stroke="#1e293b" stroke-width="2"/>
  <!-- Outer edge pentagons -->
  <polygon points="32,9 25,12 27,15.5 37,15.5 39,12" fill="#0f172a"/>
  <polygon points="50,22 49,29 54,31 55,23" fill="#0f172a"/>
  <polygon points="45,46 48,40 52,43 47,49" fill="#0f172a"/>
  <polygon points="19,46 16,40 12,43 17,49" fill="#0f172a"/>
  <polygon points="14,22 15,29 10,31 9,23" fill="#0f172a"/>
  <!-- Scoutceler vibrant green speed curve on the ball -->
  <path d="M10 38 C 12 48, 22 55, 34 54 C 42 53, 47 48, 49 44" fill="none" stroke="#00d16c" stroke-width="3" stroke-linecap="round"/>
</svg>